packages:
  - 'packages/*'

# Lets playgrounds/* resolve local packages without the 'workspace:' protocol
# during development. When a playground is cloned standalone, the same
# dependencies resolve to registry versions instead.
linkWorkspacePackages: true
preferWorkspacePackages: true

allowBuilds:
  esbuild: true

# Experimental v13 lockfile format (pnpm >= 12.19): one entry per package version,
# one line per value, with trailing commas, so a dependency update touches fewer
# lines and concurrent PRs hit fewer pnpm-lock.yaml merge conflicts.
lockfile:
  format: v13
